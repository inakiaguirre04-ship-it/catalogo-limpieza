<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Cleaning</title>
    <link rel="icon" type="image/png" href="img/logo.jpg">
    <link rel="stylesheet" href="style.css?v=18.0">
</head>
<body>

    <header class="header-principal">
        
        <div class="header-top">
            <div class="header-logo">
                <img src="img/logo.png" alt="Logo Bubble Cleaning" id="logo-principal">
            </div>
            
            <div class="search-container">
                <input type="text" id="buscador" placeholder="¿Qué estás buscando?" onkeyup="filtrarPromos()">
                <button class="btn-buscar">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>

            <div class="header-user-cart">
                <div class="user-action">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                    <div class="action-text">
                        <strong>Entrá /</strong><br>Registráte
                    </div>
                </div>
                
                <div class="cart-action" onclick="abrirCarrito()">
                    <div class="icon-circle">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    </div>
                    <div class="action-text">
                        <strong>Carrito (<span id="header-total-items">0</span>)</strong><br>$<span id="header-total-precio">0.00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="header-bottom">
            <nav class="nav-black">
                <a href="#" class="nav-cat">CATEGORÍAS 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </a>
                <a href="#" onclick="mostrarTodo()">INICIO</a>
                <a href="#" onclick="mostrarTodo()">PRODUCTOS</a>
                <a href="#">CONTACTO</a>
            </nav>
        </div>

    </header>
<section class="seccion-destacados">
        <h2 class="titulo-destacados">Destacados</h2>
        <div class="grilla-destacados">
            
            <article class="tarjeta-destacado">
                <div class="imagen-destacado">
                    <img src="img/hogar1.png" alt="Promo Hogar 1">
                </div>
                <div class="info-destacado">
                    <h3>Promo Hogar 1</h3>
                    <span class="precio-nuevo">$6.500,00</span>
                </div>
            </article>

            <article class="tarjeta-destacado">
                <div class="imagen-destacado">
                    <span class="etiqueta-gratis">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 3h15v13H1z"></path><path d="M16 8h4l3 3v5h-7V8z"></path><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg> 
                        GRATIS
                    </span>
                    <img src="img/empre1.png" alt="Combo Emprendedor">
                </div>
                <div class="info-destacado">
                    <h3>Combo Súper Emprendedor</h3>
                    <span class="precio-nuevo">$136.620,00</span>
                </div>
            </article>

            <article class="tarjeta-destacado">
                <div class="imagen-destacado">
                    <img src="img/rev1.png" alt="Promo Revendedor">
                </div>
                <div class="info-destacado">
                    <h3>Promo Revendedor 1</h3>
                    <span class="precio-nuevo">$23.700,00</span>
                </div>
            </article>

            <article class="tarjeta-destacado">
                <div class="imagen-destacado">
                    <img src="img/gastro3.png" alt="Promo Gastro">
                </div>
                <div class="info-destacado">
                    <h3>Promo Gastronómica 3</h3>
                    <span class="precio-nuevo">$10.530,00</span>
                </div>
            </article>

            <article class="tarjeta-destacado">
                <div class="imagen-destacado">
                    <img src="img/hogar2.png" alt="Promo Hogar 2">
                </div>
                <div class="info-destacado">
                    <h3>Promo Hogar 2</h3>
                    <span class="precio-nuevo">$12.500,00</span>
                </div>
            </article>

        </div>
    </section>
